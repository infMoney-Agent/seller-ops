name: dev-ci
on:
  pull_request:
    branches: [dev]
  merge_group:
    branches: [dev]
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      screening-web-postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_PASSWORD: screening-test
          POSTGRES_DB: screening_web
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d screening_web"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/backend/requirements-screening-test.txt
        working-directory: .
      - run: python -m playwright install --with-deps chromium
        working-directory: .
      - name: Browser screening acceptance
        working-directory: .
        env:
          PYTHONPATH: apps/backend
          SCREENING_DATABASE_URL: postgresql+asyncpg://postgres:screening-test@127.0.0.1:55433/screening_web
          SCREENING_STORAGE_DIR: /tmp/screening-browser-data
          SCREENING_INTERNAL_SECRET: ci-browser-test-secret-with-at-least-32-characters
          SELLER_APP_ORIGIN: http://127.0.0.1:19443
          SELLER_API_URL: http://127.0.0.1:19580
          ECOM_API_URL: http://127.0.0.1:19580
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
        run: |
          (cd apps/backend && python -m alembic -c alembic-screening.ini upgrade head)
          python -m uvicorn tests.screening_browser_server:app --host 127.0.0.1 --port 19580 > /tmp/screening-api.log 2>&1 &
          api_pid=$!
          npm --prefix apps/web run start -- --hostname 127.0.0.1 --port 19443 > /tmp/screening-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:19443/dashboard/ecom/screening -o /dev/null; then break; fi
            sleep 1
          done
          python apps/backend/tests/screening_browser.py
          python apps/backend/tests/screening_monthly_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screening-browser-qa
          path: |
            /tmp/screening-qa
            /tmp/screening-api.log
            /tmp/screening-web.log
  auth:
    name: Go authentication tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: seller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d seller_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/auth/go.mod
          cache-dependency-path: apps/auth/go.sum
      - run: go test ./...
        working-directory: apps/auth
        env:
          TEST_DATABASE_URL: postgres://postgres:test-password@127.0.0.1:5432/seller_test?sslmode=disable
  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      screening-postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_PASSWORD: screening-test
          POSTGRES_DB: screening_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d screening_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: apps/backend
      - run: python -m alembic -c alembic-screening.ini upgrade head
        working-directory: apps/backend
        env:
          SCREENING_DATABASE_URL: postgresql+asyncpg://postgres:screening-test@127.0.0.1:55432/screening_test
      - name: Verify product monthly migration preserves history
        run: python scripts/verify-monthly-migration.py
        working-directory: apps/backend
        env:
          SCREENING_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:screening-test@127.0.0.1:55432/screening_monthly_migration_test
      - run: python -m pytest -q
        working-directory: apps/backend
        env:
          SCREENING_TEST_DATABASE_URL: postgresql+asyncpg://postgres:screening-test@127.0.0.1:55432/screening_test
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          REDIS_URL: redis://127.0.0.1:6379/0
  required:
    name: Dev CI required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    needs: [web, auth, backend]
    steps:
      - name: Require all checks to pass
        env:
          WEB: ${{ needs.web.result }}
          AUTH: ${{ needs.auth.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          printf 'Web: %s\nAuth: %s\nBackend: %s\n' "$WEB" "$AUTH" "$BACKEND"
          test "$WEB" = success && test "$AUTH" = success && test "$BACKEND" = success

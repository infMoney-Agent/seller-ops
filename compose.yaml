services:
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN}
    networks:
      default:
        aliases: ["${AUTH_DOMAIN}"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/auth/casdoor/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
  web:
    build:
      context: .
      dockerfile: apps/web/Web.Dockerfile
    environment:
      SELLER_API_URL: http://api:8080
      NEXT_PUBLIC_SENTRY_DISABLED: "true"
      SELLER_APP_ORIGIN: https://${APP_DOMAIN}
      ECOM_API_URL: http://ecom-api:8000
      SCREENING_INTERNAL_SECRET: ${SCREENING_INTERNAL_SECRET:?Set SCREENING_INTERNAL_SECRET}
  api:
    profiles: [app]
    build: ./apps/auth
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ORIGIN: https://${APP_DOMAIN}
      OIDC_ISSUER: https://${AUTH_DOMAIN}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      DATABASE_URL: postgres://seller_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/seller_ops?sslmode=disable
  casdoor:
    image: casbin/casdoor:v4.25.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dataSourceName: host=db port=5432 user=casdoor password=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD} sslmode=disable dbname=casdoor
      dbName: casdoor
      origin: https://${AUTH_DOMAIN}
      runmode: prod
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./apps/auth/casdoor/init-db.sh:/docker-entrypoint-initdb.d/10-seller.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 15

  ecom-api:
    profiles: [app]
    build: ./apps/backend
    restart: on-failure
    depends_on:
      screening-migrate:
        condition: service_completed_successfully
      ecom-redis:
        condition: service_healthy
    environment: &ecom-env
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////data/ecom.db
      SCREENING_DATABASE_URL: postgresql+asyncpg://seller_screening:${SCREENING_DB_PASSWORD:?Set SCREENING_DB_PASSWORD}@db:5432/seller_screening
      SCREENING_INTERNAL_SECRET: ${SCREENING_INTERNAL_SECRET:?Set SCREENING_INTERNAL_SECRET}
      SCREENING_STORAGE_DIR: /screening-data
      REDIS_URL: redis://ecom-redis:6379/0
      CELERY_BROKER_URL: redis://ecom-redis:6379/0
      CELERY_RESULT_BACKEND: redis://ecom-redis:6379/1
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      AMAZON_CLIENT_ID: ${AMAZON_CLIENT_ID:-}
      AMAZON_CLIENT_SECRET: ${AMAZON_CLIENT_SECRET:-}
      AMAZON_REFRESH_TOKEN: ${AMAZON_REFRESH_TOKEN:-}
      AMAZON_MARKETPLACE_ID: ${AMAZON_MARKETPLACE_ID:-ATVPDKIKX0DER}
      AMAZON_ADS_CLIENT_ID: ${AMAZON_ADS_CLIENT_ID:-}
      AMAZON_ADS_CLIENT_SECRET: ${AMAZON_ADS_CLIENT_SECRET:-}
      AMAZON_ADS_REFRESH_TOKEN: ${AMAZON_ADS_REFRESH_TOKEN:-}
      AMAZON_ADS_PROFILE_ID: ${AMAZON_ADS_PROFILE_ID:-}
    volumes:
      - ecom-data:/data
      - screening-data:/screening-data
  ecom-worker:
    profiles: [app]
    build: ./apps/backend
    restart: on-failure
    depends_on:
      screening-migrate:
        condition: service_completed_successfully
      ecom-redis:
        condition: service_healthy
    environment: *ecom-env
    volumes:
      - screening-data:/screening-data
    command: celery -A app.workers.celery_app worker --loglevel=info
  ecom-beat:
    profiles: [app]
    build: ./apps/backend
    restart: on-failure
    depends_on:
      screening-migrate:
        condition: service_completed_successfully
      ecom-redis:
        condition: service_healthy
    environment: *ecom-env
    command: celery -A app.workers.celery_app beat --loglevel=info
  screening-db-init:
    profiles: [app]
    image: postgres:17.7-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SCREENING_DB_PASSWORD: ${SCREENING_DB_PASSWORD:?Set SCREENING_DB_PASSWORD}
    volumes:
      - ./apps/backend/scripts/init-screening-db.sh:/init-screening-db.sh:ro
    entrypoint: ["sh", "/init-screening-db.sh"]
  screening-migrate:
    profiles: [app]
    build: ./apps/backend
    environment: *ecom-env
    command: python -m alembic -c alembic-screening.ini upgrade head
    depends_on:
      screening-db-init:
        condition: service_completed_successfully
  ecom-redis:
    profiles: [app]
    image: redis:7-alpine
    restart: on-failure
    command: redis-server --appendonly yes
    volumes:
      - ecom-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  ecom-data:
  screening-data:
  ecom-redis-data:
  database:
  caddy-data:
  caddy-config:

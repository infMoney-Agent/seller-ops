service ScreeningService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc GetProductFamily(GetProductFamilyRequest) returns (GetProductFamilyResponse);
  rpc ListProductMonthly(ListProductMonthlyRequest) returns (ListProductMonthlyResponse);
  rpc ListProductObservations(ListProductObservationsRequest) returns (ListProductObservationsResponse);
  rpc GetObservationSource(GetObservationSourceRequest) returns (GetObservationSourceResponse);
  rpc ListProductHistory(ListProductHistoryRequest) returns (ListProductHistoryResponse);
  rpc ListProductReferences(ListProductReferencesRequest) returns (ListProductReferencesResponse);
  rpc ListProfitScenarios(ListProfitScenariosRequest) returns (ListProfitScenariosResponse);
  rpc ListGroupProducts(ListGroupProductsRequest) returns (ListGroupProductsResponse);
  rpc ListParentMonthly(ListParentMonthlyRequest) returns (ListParentMonthlyResponse);
  rpc ListMonths(ListMonthsRequest) returns (ListMonthsResponse);
  rpc ListTrademarkOptions(ListTrademarkOptionsRequest) returns (ListTrademarkOptionsResponse);
  rpc ListReviewCategories(ListReviewCategoriesRequest) returns (ListReviewCategoriesResponse);
  rpc GetReviewWorkspace(GetReviewWorkspaceRequest) returns (GetReviewWorkspaceResponse);
  rpc ListReviewBatches(ListReviewBatchesRequest) returns (ListReviewBatchesResponse);
  rpc GetReviewBatch(GetReviewBatchRequest) returns (GetReviewBatchResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc ListProfitTemplates(ListProfitTemplatesRequest) returns (ListProfitTemplatesResponse);
  rpc ListProfitProducts(ListProfitProductsRequest) returns (ListProfitProductsResponse);
  rpc GetScreenRun(GetScreenRunRequest) returns (GetScreenRunResponse);
  rpc ReviewProduct(ReviewProductRequest) returns (ReviewProductResponse);
  rpc UpdateProductCategory(UpdateProductCategoryRequest) returns (UpdateProductCategoryResponse);
  rpc UpdateProductParameters(UpdateProductParametersRequest) returns (UpdateProductParametersResponse);
  rpc SaveProfitScenario(SaveProfitScenarioRequest) returns (SaveProfitScenarioResponse);
  rpc CalculateProfit(CalculateProfitRequest) returns (CalculateProfitResponse);
  rpc CreateReviewPreview(CreateReviewPreviewRequest) returns (CreateReviewPreviewResponse);
  rpc ApplyReviewBatch(ApplyReviewBatchRequest) returns (ApplyReviewBatchResponse);
  rpc UndoReviewBatch(UndoReviewBatchRequest) returns (UndoReviewBatchResponse);
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
  rpc CreateProfitTemplate(CreateProfitTemplateRequest) returns (CreateProfitTemplateResponse);
  rpc TestPolicy(TestPolicyRequest) returns (TestPolicyResponse);
  rpc ActivatePolicy(ActivatePolicyRequest) returns (ActivatePolicyResponse);
  rpc CreateScreenRun(CreateScreenRunRequest) returns (CreateScreenRunResponse);
  rpc CreateExport(CreateExportRequest) returns (CreateExportResponse);
  rpc CreateProfitBatch(CreateProfitBatchRequest) returns (CreateProfitBatchResponse);
}

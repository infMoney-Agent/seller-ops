name: prod-cd
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seller-ops-prod-deploy
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/dev-ci.yaml
  images:
    name: Build and publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: prod-server
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: .
            dockerfile: apps/web/Web.Dockerfile
          - image: auth
            context: .
            dockerfile: apps/auth/Dockerfile
          - image: backend
            context: .
            dockerfile: apps/backend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image registry
        id: registry
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY:-ghcr.io}"
          if [[ -n "${IMAGE_NAMESPACE:-}" ]]; then
            namespace="$IMAGE_NAMESPACE"
          else
            namespace="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          fi
          username="${REGISTRY_USERNAME:-$GITHUB_ACTOR}"
          password="${REGISTRY_PASSWORD:-$GITHUB_TOKEN}"
          if [[ "$registry" != "ghcr.io" ]]; then
            : "${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE in prod-server environment for custom registry}"
            : "${REGISTRY_USERNAME:?Set REGISTRY_USERNAME secret in prod-server environment}"
            : "${REGISTRY_PASSWORD:?Set REGISTRY_PASSWORD secret in prod-server environment}"
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "prefix=$registry/$namespace/seller-ops" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.registry.outputs.prefix }}-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.registry.outputs.prefix }}-${{ matrix.image }}:main
          cache-from: type=gha,scope=prod-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Transfer image over SSH and publish from production server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY: ${{ steps.registry.outputs.registry }}
          PREFIX: ${{ steps.registry.outputs.prefix }}
          REG_USER: ${{ steps.registry.outputs.username }}
          REG_PASS: ${{ steps.registry.outputs.password }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}" "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing DEPLOY_SSH_KEY}" "${DEPLOY_HOST_KEY:?Missing DEPLOY_KNOWN_HOSTS}"
          umask 077
          transfer_dir=$(mktemp -d)
          export PROD_TRANSFER_DIR="$transfer_dir" PROD_ARCHIVE_DIGEST=""
          ssh_prod() {
            ssh -T -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PROD_TRANSFER_DIR/known_hosts" \
              -i "$PROD_TRANSFER_DIR/key" "$DEPLOY_USER@$DEPLOY_HOST" "$1"
          }
          cleanup_transfer() {
            if [[ -n "$PROD_ARCHIVE_DIGEST" ]]; then
              ssh_prod "discard $GITHUB_SHA $IMAGE $PROD_ARCHIVE_DIGEST" </dev/null >/dev/null 2>&1 || true
            fi
            rm -rf -- "$PROD_TRANSFER_DIR"
          }
          trap cleanup_transfer EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$transfer_dir/key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$transfer_dir/known_hosts"
          docker save "$PREFIX-$IMAGE:$GITHUB_SHA" | gzip -1 > "$transfer_dir/image.tar.gz"
          digest=$(sha256sum "$transfer_dir/image.tar.gz")
          export PROD_ARCHIVE_DIGEST="${digest%% *}"
          split -b 4194304 -d -a 3 "$transfer_dir/image.tar.gz" "$transfer_dir/chunk."
          chunks=("$transfer_dir"/chunk.*)
          (( ${#chunks[@]} <= 256 )) || { echo 'Image archive exceeds chunk limit' >&2; exit 1; }
          ssh_prod "begin $GITHUB_SHA $IMAGE $PROD_ARCHIVE_DIGEST" </dev/null
          send_chunk() {
            local file=$1 index checksum attempt
            index=${file##*.}
            checksum=$(sha256sum "$file")
            checksum=${checksum%% *}
            for attempt in 1 2 3; do
              if ssh_prod "chunk $GITHUB_SHA $IMAGE $PROD_ARCHIVE_DIGEST $index $checksum" <"$file"; then
                return 0
              fi
              [[ $attempt == 3 ]] || sleep 5
            done
            return 1
          }
          export -f ssh_prod send_chunk
          printf '%s\0' "${chunks[@]}" | xargs -0 -n 1 -P 8 bash -c 'send_chunk "$1"' _
          for attempt in 1 2 3; do
            if printf '%s\n%s\n%s\n%s\n' "$REGISTRY" "$PREFIX" "$REG_USER" "$REG_PASS" |
              ssh_prod "publish $GITHUB_SHA $IMAGE $PROD_ARCHIVE_DIGEST ${#chunks[@]}"; then
              exit 0
            fi
            [[ $attempt == 3 ]] || sleep 5
          done
          exit 1
  deploy:
    name: Deploy to production server
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod-server
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy verified main revision over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}" "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing DEPLOY_SSH_KEY}" "${DEPLOY_HOST_KEY:?Missing DEPLOY_KNOWN_HOSTS}"
          registry="${IMAGE_REGISTRY:-ghcr.io}"
          if [[ -n "${IMAGE_NAMESPACE:-}" ]]; then
            namespace="$IMAGE_NAMESPACE"
          else
            namespace="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          fi
          prefix="$registry/$namespace/seller-ops"
          reg_user="${REGISTRY_USERNAME:-$GITHUB_ACTOR}"
          reg_pass="${REGISTRY_PASSWORD:-$GITHUB_TOKEN}"
          ssh_port="${DEPLOY_PORT:-22}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          printf '%s\n%s\n%s\n%s\n' "$registry" "$prefix" "$reg_user" "$reg_pass" |
            ssh -T -p "$ssh_port" -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
              -i "$ssh_dir/key" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

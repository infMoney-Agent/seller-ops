name: Dev CI
on:
  pull_request:
    branches: [dev]
  merge_group:
    branches: [dev]
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
  auth:
    name: Go authentication tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: seller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d seller_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/auth/go.mod
          cache-dependency-path: apps/auth/go.sum
      - run: go test ./...
        working-directory: apps/auth
        env:
          TEST_DATABASE_URL: postgres://postgres:test-password@127.0.0.1:5432/seller_test?sslmode=disable
  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: apps/backend
      - run: python -m pytest -q
        working-directory: apps/backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          REDIS_URL: redis://127.0.0.1:6379/0
  required:
    name: Dev CI required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    needs: [web, auth, backend]
    steps:
      - name: Require all checks to pass
        env:
          WEB: ${{ needs.web.result }}
          AUTH: ${{ needs.auth.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          printf 'Web: %s\nAuth: %s\nBackend: %s\n' "$WEB" "$AUTH" "$BACKEND"
          test "$WEB" = success && test "$AUTH" = success && test "$BACKEND" = success

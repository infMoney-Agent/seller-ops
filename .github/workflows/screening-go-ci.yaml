name: Screening Go CI

on:
  pull_request:
    branches: [dev]
    paths:
      - apps/screening/**
      - .github/workflows/screening-go-ci.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screening-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_USER: screening_test
          POSTGRES_PASSWORD: screening_test
          POSTGRES_DB: screening_ci_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U screening_test -d screening_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/screening
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/screening/go.mod
          cache-dependency-path: apps/screening/go.sum
      - run: go test -race -count=1 -v ./...
        env:
          SCREENING_TEST_DATABASE_URL: postgresql://screening_test:screening_test@127.0.0.1:55434/screening_ci_test?sslmode=disable
      - run: go vet ./...
      - run: go build -trimpath ./...
